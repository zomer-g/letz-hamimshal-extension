<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  :root { --primary:#044E66; --primary-dark:#003647; --primary-light:#06607C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:440px; height:280px; overflow:hidden; }
  body {
    font-family: Rubik, Heebo, "Segoe UI", Arial, sans-serif;
    direction: rtl;
    background: linear-gradient(140deg, #06607C 0%, #044E66 55%, #003647 100%);
    color:#fff; position:relative;
  }
  .glow { position:absolute; inset:0; background: radial-gradient(420px 240px at 85% -20%, rgba(255,255,255,.14), transparent 60%); }
  .wrap { position:absolute; inset:0; padding:28px 40px; display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; gap:14px; }
  .logo { width:52px; height:52px; border-radius:13px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; }
  .logo img { width:40px; height:40px; }
  .brand { font-weight:800; font-size:26px; letter-spacing:-.3px; }
  .sub { font-size:13px; color:rgba(255,255,255,.7); margin-top:2px; }
  .headline { font-size:22px; font-weight:700; line-height:1.3; max-width:355px; }
  .headline b { color:#9CD9EA; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:5px 13px; font-size:12px; font-weight:600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="top">
      <div class="logo"><img src="../icons/icon-128.png" alt=""></div>
      <div>
        <div class="brand">GovScraper</div>
        <div class="sub">גרסאות לעם · over.org.il</div>
      </div>
    </div>
    <div class="headline">מאגרי הממשלה <b>בלחיצה אחת</b><br>להורדה כקובץ — מקומי בדפדפן</div>
    <div class="pills">
      <span class="pill">gov.il</span>
      <span class="pill">nadlan</span>
      <span class="pill">govmap</span>
      <span class="pill">idf.il</span>
    </div>
  </div>
</body>
</html>
